name: Maven CI

on:
  workflow_dispatch:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: automation
          POSTGRES_USER: automation
          POSTGRES_PASSWORD: automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation -d automation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify and test
        run: mvn --batch-mode clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/automation
          DB_USERNAME: automation
          DB_PASSWORD: automation
          DB_TESTS_ENABLED: "true"
